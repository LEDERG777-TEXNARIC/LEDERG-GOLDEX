<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEDERG — Messenger</title>
<style>
:root{
 --bg:#0b1017;--panel:#111821;--panel2:#151e29;--line:#243140;--text:#f5f7fb;--muted:#8997a8;
 --accent:#3f91ff;--accent2:#2d7ce0;--bubble:#244c76;--bubble2:#172331;--green:#2bd673;--danger:#ff5a67;
 --shadow:0 18px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
.no-animations *{transition:none!important;animation:none!important}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer;color:inherit}
body.light{--bg:#edf2f7;--panel:#fff;--panel2:#f3f6fa;--line:#d8e0e8;--text:#17202b;--muted:#657180;--bubble:#d7ebff;--bubble2:#fff;--shadow:0 18px 50px rgba(40,60,80,.15)}
#auth{height:100%;display:grid;place-items:center;padding:20px}
.auth-card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:var(--shadow)}
.logo{font-size:34px;font-weight:900;letter-spacing:.16em}
.sub{color:var(--muted);margin:8px 0 28px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border-radius:14px;padding:4px;margin-bottom:18px}
.tabs button{padding:11px;border-radius:10px;background:transparent;color:var(--muted)}
.tabs button.active{background:var(--accent);color:#fff}
.field,.search,.settings-input,.settings-select,.settings-textarea{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);color:var(--text);outline:none}
.field{margin-bottom:10px}
.field:focus,.search:focus,.settings-input:focus,.settings-select:focus,.settings-textarea:focus{border-color:var(--accent)}
.primary{width:100%;padding:13px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;margin-top:5px}
.error{min-height:20px;margin-top:10px;color:#ff8390;font-size:13px}
.app{height:100%;display:grid;grid-template-columns:350px 1fr;overflow:hidden}
.sidebar{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0}
.side-top{padding:18px 16px 10px;border-bottom:1px solid var(--line)}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;letter-spacing:.16em;font-size:20px}
.me-mini{display:flex;align-items:center;gap:9px;min-width:0}
.me-mini .name{font-weight:700;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-mini .nick{font-size:12px;color:var(--muted)}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center}
.icon-btn:hover{border-color:var(--accent)}
.search-wrap{position:relative;margin-top:14px}
.search{padding-left:14px}
.search-results{position:absolute;z-index:20;left:0;right:0;top:48px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);max-height:380px;overflow:auto}
.search-item,.chat-item{display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer}
.search-item:hover,.chat-item:hover{background:var(--panel2)}
.chat-list{overflow:auto;min-height:0}
.section{padding:10px 16px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.avatar{width:46px;height:46px;border-radius:50%;flex:0 0 46px;background:linear-gradient(135deg,#2766aa,#4ea1ff);display:grid;place-items:center;font-weight:900;color:#fff;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.chat-info{min-width:0;flex:1}
.chat-name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.time{font-size:10px;color:var(--muted);align-self:flex-start;margin-top:3px}
.presence-dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 0 3px rgba(43,214,115,.12);margin-left:6px;vertical-align:middle}
.chat-item.active{background:rgba(63,145,255,.12)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.chat{min-width:0;display:flex;flex-direction:column;background:#0c131c}
body.light .chat{background:#eef3f8}
.chat-head{height:72px;display:flex;align-items:center;gap:11px;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(17,24,33,.82);backdrop-filter:blur(12px)}
body.light .chat-head{background:rgba(255,255,255,.88)}
.chat-head-info{min-width:0;flex:1}
.chat-head-title{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head-sub{font-size:12px;color:var(--muted);margin-top:2px}
.head-actions{display:flex;gap:8px}
.messages{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:7px;background-size:cover;background-position:center}
.msg{max-width:min(70%,720px);padding:9px 12px;border-radius:17px;background:var(--bubble2);align-self:flex-start;box-shadow:0 1px 0 rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.03)}
.msg.mine{align-self:flex-end;background:var(--bubble)}
.msg-author{font-size:11px;color:#72afff;margin-bottom:4px}
.msg-text{white-space:pre-wrap;word-break:break-word;font-size:var(--msg-size,16px)}
.msg-meta{text-align:right;color:var(--muted);font-size:10px;margin-top:4px}
.composer{padding:14px 16px;border-top:1px solid var(--line);display:flex;gap:10px;background:var(--panel)}
.composer input{flex:1;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);outline:none}
.send{width:49px;border-radius:14px;background:var(--accent2);color:#fff;font-size:18px}
.welcome{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;padding:30px}
.mobile-back{display:none;background:transparent;color:var(--text);font-size:22px}
.online-line{font-size:12px;color:var(--muted);height:16px}
.typing{color:#62b3ff}
.profile-card{display:flex;align-items:center;gap:15px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel2)}
.profile-big{width:82px;height:82px;border-radius:50%;font-size:28px}
.settings-grid{display:grid;grid-template-columns:170px 1fr;min-height:430px}
.settings-nav{border-right:1px solid var(--line);padding:12px}
.settings-nav button{width:100%;text-align:left;padding:11px 12px;border-radius:10px;background:transparent;color:var(--muted);margin-bottom:4px}
.settings-nav button.active{background:rgba(63,145,255,.12);color:#fff}
body.light .settings-nav button.active{color:var(--text)}
.settings-content{padding:18px;overflow:auto}
.setting-section{margin-bottom:25px}
.setting-title{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:10px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.settings-row:last-child{border-bottom:0}
.settings-row .desc{color:var(--muted);font-size:12px;margin-top:3px}
.toggle{width:48px;height:28px;border-radius:16px;background:#465260;position:relative;flex:0 0 48px}
.toggle:after{content:'';position:absolute;width:22px;height:22px;top:3px;left:3px;background:#fff;border-radius:50%;transition:.18s}
.toggle.on{background:var(--accent)}
.toggle.on:after{left:23px}
.settings-textarea{min-height:92px;resize:vertical}
.settings-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.secondary{padding:10px 13px;border-radius:11px;background:var(--panel2);border:1px solid var(--line)}
.danger{padding:10px 13px;border-radius:11px;background:rgba(255,90,103,.12);color:#ff8590}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.58);display:grid;place-items:center;padding:20px;z-index:100}
.modal{width:min(790px,100%);max-height:min(760px,94vh);overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-title{font-weight:850;font-size:18px}
.session{border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:8px;background:var(--panel2)}
.session-main{display:flex;justify-content:space-between;gap:12px}
.session small{color:var(--muted)}
.notice{padding:12px;border-radius:13px;background:rgba(63,145,255,.09);border:1px solid rgba(63,145,255,.25);color:#a8ceff;font-size:12px;line-height:1.45}
@media(max-width:760px){
 .app{grid-template-columns:1fr}
 .sidebar{display:flex}
 .chat{display:none}
 .chat.open{display:flex}
 .sidebar.hidden{display:none}
 .mobile-back{display:block}
 .settings-grid{grid-template-columns:1fr}
 .settings-nav{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;gap:5px}
 .settings-nav button{white-space:nowrap;width:auto}
 .msg{max-width:87%}
}
</style>
</head>
<body>
<div id="auth">
  <div class="auth-card">
    <div class="logo">LEDERG</div>
    <div class="sub">Приватный self-hosted мессенджер</div>
    <div class="tabs"><button id="tabLogin" class="active">Вход</button><button id="tabRegister">Регистрация</button></div>
    <form id="authForm">
      <input id="username" class="field" autocomplete="username" placeholder="Никнейм" required>
      <input id="displayName" class="field" autocomplete="name" placeholder="Имя" style="display:none">
      <input id="password" class="field" type="password" autocomplete="current-password" placeholder="Пароль" required>
      <input id="otpCode" class="field" inputmode="numeric" autocomplete="one-time-code" placeholder="Код 2FA" maxlength="8" style="display:none">
      <button class="primary" id="authButton">Войти</button>
      <div id="authError" class="error"></div>
    </form>
  </div>
</div>

<div id="app" class="app" style="display:none">
  <aside id="sidebar" class="sidebar">
    <div class="side-top">
      <div class="brand-row">
        <div class="brand">LEDERG</div>
        <div style="display:flex;gap:7px">
          <button id="settingsBtn" class="icon-btn" title="Настройки">⚙</button>
        </div>
      </div>
      <div class="me-mini" style="margin-top:13px">
        <div id="myAvatar" class="avatar">L</div>
        <div style="min-width:0;flex:1"><div id="myName" class="name"></div><div id="myUsername" class="nick"></div></div>
      </div>
      <div class="search-wrap">
        <input id="searchInput" class="search" placeholder="Поиск по @нику или имени">
        <div id="searchResults" class="search-results" style="display:none"></div>
      </div>
      <div style="margin-top:9px;text-align:right"><button id="logout" class="secondary">Выйти</button></div>
    </div>
    <div class="section">Личные чаты</div>
    <div id="chatList" class="chat-list"><div class="empty">Загрузка…</div></div>
  </aside>

  <main id="chatPane" class="chat">
    <div id="welcome" class="welcome">
      <div><div style="font-size:25px;color:var(--text);font-weight:900;margin-bottom:8px">LEDERG</div><div>Найди пользователя по нику и начни личный чат.</div></div>
    </div>
    <div id="chatView" style="display:none;height:100%;min-height:0;flex-direction:column">
      <div class="chat-head">
        <button id="backBtn" class="mobile-back">‹</button>
        <div id="chatAvatar" class="avatar">L</div>
        <div class="chat-head-info">
          <div id="chatTitle" class="chat-head-title"></div>
          <div id="chatSub" class="online-line"></div>
        </div>
        <div class="head-actions">
          <button id="chatSettingsBtn" class="icon-btn" title="Настройки чата">⚙</button>
        </div>
      </div>
      <div id="messages" class="messages"></div>
      <form id="composer" class="composer">
        <input id="messageInput" maxlength="4096" autocomplete="off" placeholder="Написать сообщение…">
        <button class="send" title="Отправить">➤</button>
      </form>
    </div>
  </main>
</div>

<div id="settingsModal" class="modal-backdrop" style="display:none">
 <div class="modal">
  <div class="modal-head"><div class="modal-title">Настройки LEDERG</div><button id="settingsClose" class="icon-btn">✕</button></div>
  <div class="settings-grid">
   <nav class="settings-nav">
    <button data-section="profile" class="active">Профиль</button>
    <button data-section="privacy">Приватность</button>
    <button data-section="appearance">Оформление</button>
    <button data-section="security">Безопасность</button>
    <button data-section="notifications">Уведомления</button>
   </nav>
   <div id="settingsContent" class="settings-content"></div>
  </div>
 </div>
</div>

<div id="chatSettingsModal" class="modal-backdrop" style="display:none">
 <div class="modal" style="max-width:560px">
  <div class="modal-head"><div class="modal-title">Настройки личного чата</div><button id="chatSettingsClose" class="icon-btn">✕</button></div>
  <div class="settings-content">
   <div class="setting-section">
    <div class="setting-title">Фон</div>
    <div class="notice">Обои сохраняются отдельно для твоего устройства и этого чата. Второй пользователь их не увидит.</div>
    <div class="settings-actions">
      <label class="secondary" style="cursor:pointer">Выбрать свои обои<input id="wallpaperInput" type="file" accept="image/jpeg,image/png,image/webp" hidden></label>
      <button id="wallpaperClear" class="danger">Сбросить фон</button>
    </div>
   </div>
   <div class="setting-section">
    <div class="setting-title">Чат</div>
    <div class="settings-actions">
      <button id="muteChatBtn" class="secondary">Без звука</button>
      <button id="blockChatUserBtn" class="danger">Заблокировать пользователя</button>
    </div>
   </div>
   <div class="setting-section">
    <div class="setting-title">Быстрые варианты</div>
    <div class="settings-actions">
      <button class="secondary quick-wall" data-wall="">Без фона</button>
      <button class="secondary quick-wall" data-wall="gradient">Градиент</button>
    </div>
   </div>
  </div>
 </div>
</div>

<script>
const state={
 token:localStorage.getItem('lederg_token'),
 user:null,
 chats:[],
 activeChat:null,
 ws:null,
 authMode:'login',
 searchTimer:null,
 searchUsers:[],
 typingTimer:null,
 notificationEnabled:localStorage.getItem('lederg_notify')==='1',
 theme:localStorage.getItem('lederg_theme')||'dark',
 activeSettings:'profile',
 requires2fa:false,
 textSize:localStorage.getItem('lederg_text_size')||'16',
 animations:localStorage.getItem('lederg_animations')!=='0',
 sendByEnter:localStorage.getItem('lederg_send_enter')!=='0'
};
const $=id=>document.getElementById(id);

function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function initials(name){return (name||'L').trim().slice(0,1).toUpperCase()}
function time(v){if(!v)return '';try{return new Date(v).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}catch{return ''}}
function avatarHtml(u,cls='avatar'){const url=u?.avatar_url;return url?'<div class="'+cls+'"><img src="'+escapeHtml(url)+'?v='+(u?.id||Date.now())+'" alt=""></div>':'<div class="'+cls+'">'+escapeHtml(initials(u?.display_name))+'</div>'}
function setTheme(t){state.theme=t;localStorage.setItem('lederg_theme',t);document.body.classList.toggle('light',t==='light')}
function api(path,options={}){
 const headers={...(options.headers||{})};
 if(!(options.body instanceof FormData))headers['Content-Type']='application/json';
 if(state.token)headers.Authorization='Bearer '+state.token;
 return fetch(path,{...options,headers}).then(async r=>{
   const data=await r.json().catch(()=>({}));
   if(r.status===401){logout();throw new Error(data.detail||'Сессия истекла')}
   if(!r.ok)throw new Error(typeof data.detail==='string'?data.detail:'Ошибка сервера');
   return data
 })
}
function showAuth(){$('auth').style.display='grid';$('app').style.display='none'}
function showApp(){$('auth').style.display='none';$('app').style.display='grid'}
function setAuthMode(mode){
 state.authMode=mode;
 $('tabLogin').classList.toggle('active',mode==='login');
 $('tabRegister').classList.toggle('active',mode==='register');
 $('displayName').style.display=mode==='register'?'block':'none';
 $('authButton').textContent=mode==='register'?'Создать аккаунт':'Войти';
 $('authError').textContent='';
 state.requires2fa=false;$('otpCode').style.display='none';$('otpCode').value='';
}
function applyMyProfile(){
 const u=state.user;
 $('myName').textContent=u.display_name;
 $('myUsername').textContent='@'+u.username;
 $('myAvatar').innerHTML=u.avatar_url?'<img src="'+escapeHtml(u.avatar_url)+'?v='+Date.now()+'" alt="">':escapeHtml(initials(u.display_name));
}
async function loadMe(){state.user=await api('/api/users/me');applyMyProfile()}
function peerOf(c){return c.peer}
function renderChats(){
 const box=$('chatList');
 if(!state.chats.length){box.innerHTML='<div class="empty">Пока нет личных чатов.<br>Найди человека через поиск.</div>';return}
 box.innerHTML='';
 for(const c of state.chats){
   const p=peerOf(c);
   const name=p?.display_name||c.title||'LEDERG';
   const presence=p?.online?'<span class="presence-dot"></span>':'';
   const row=document.createElement('div');
   row.className='chat-item'+(state.activeChat?.id===c.id?' active':'');
   row.innerHTML=avatarHtml(p||{display_name:name})+'<div class="chat-info"><div class="chat-name">'+escapeHtml(name)+presence+'</div><div class="preview">'+(p?'@'+escapeHtml(p.username):(c.last_message?.text?escapeHtml(c.last_message.text):'Личный чат'))+'</div></div><div class="time">'+time(c.last_message?.created_at)+'</div>';
   row.onclick=()=>openChat(c);
   box.appendChild(row);
 }
}
async function loadChats(){state.chats=await api('/api/chats');renderChats()}
async function openChat(chat){
 state.activeChat=chat;
 renderChats();
 $('welcome').style.display='none';
 $('chatView').style.display='flex';
 $('chatTitle').innerHTML=escapeHtml(chat.peer?.display_name||chat.title||'LEDERG')+(chat.peer?.online?'<span class="presence-dot"></span>':'');
 $('chatSub').innerHTML=chat.peer?.online?'<span style="color:var(--green)">в сети</span>':'Личный чат';
 $('chatAvatar').innerHTML=chat.peer?.avatar_url?'<img src="'+escapeHtml(chat.peer.avatar_url)+'?v='+Date.now()+'" alt="">':escapeHtml(initials(chat.peer?.display_name||chat.title));
 $('messages').innerHTML='<div class="empty">Загрузка сообщений…</div>';
 await loadMessages(chat.id);
 await loadChatWallpaper(chat.id);
 if(innerWidth<=760){$('chatPane').classList.add('open');$('sidebar').classList.add('hidden')}
}
async function loadMessages(chatId){
 const rows=await api('/api/chats/'+chatId+'/messages');
 const box=$('messages');box.innerHTML='';
 for(const m of rows)addMessage(m,false);
 box.scrollTop=box.scrollHeight;
}
function addMessage(m,scroll=true){
 if(!state.activeChat||m.chat_id!==state.activeChat.id)return;
 const box=$('messages');
 if(box.querySelector('.empty'))box.innerHTML='';
 if(box.querySelector('.msg[data-id="'+m.id+'"]'))return;
 const mine=m.sender_id===state.user.id;
 const el=document.createElement('div');
 el.className='msg'+(mine?' mine':'');
 el.dataset.id=m.id;
 el.innerHTML=(m.sender&&!mine?'<div class="msg-author">'+escapeHtml(m.sender.display_name)+'</div>':'')+'<div class="msg-text">'+escapeHtml(m.text)+'</div><div class="msg-meta">'+time(m.created_at)+(m.edited_at?' · изменено':'')+'</div>';
 box.appendChild(el);
 if(scroll)box.scrollTop=box.scrollHeight;
}
async function findUsers(q){
 if(!q.trim()){$('searchResults').style.display='none';state.searchUsers=[];return}
 try{
   state.searchUsers=await api('/api/users/search?q='+encodeURIComponent(q.trim()));
   renderSearch();
 }catch(e){state.searchUsers=[];$('searchResults').style.display='none'}
}
function renderSearch(){
 const box=$('searchResults');box.innerHTML='';
 if(!state.searchUsers.length)box.innerHTML='<div class="empty">Ничего не найдено</div>';
 for(const u of state.searchUsers){
   const row=document.createElement('div');row.className='search-item';
   const presence=u.online?'<span class="presence-dot"></span>':'';
   row.innerHTML=avatarHtml(u)+'<div class="chat-info"><div class="chat-name">'+escapeHtml(u.display_name)+presence+'</div><div class="preview">@'+escapeHtml(u.username)+'</div></div>';
   row.onclick=()=>startChat(u);
   box.appendChild(row);
 }
 box.style.display='block';
}
async function startChat(user){
 $('searchInput').value='';$('searchResults').style.display='none';
 try{
   const c=await api('/api/chats',{method:'POST',body:JSON.stringify({user_id:user.id})});
   await loadChats();
   const chat=state.chats.find(x=>x.id===c.id)||c;
   if(!chat.peer)chat.peer=user;
   await openChat(chat);
 }catch(e){alert(e.message)}
}
function updatePresence(uid,online){
 for(const c of state.chats)if(c.peer?.id===uid)c.peer.online=online;
 for(const u of state.searchUsers)if(u.id===uid)u.online=online;
 renderChats();
 if($('searchResults').style.display!=='none')renderSearch();
 if(state.activeChat?.peer?.id===uid){
   state.activeChat.peer.online=online;
   $('chatTitle').innerHTML=escapeHtml(state.activeChat.peer.display_name)+(online?'<span class="presence-dot"></span>':'');
   $('chatSub').innerHTML=online?'<span style="color:var(--green)">в сети</span>':'Личный чат';
 }
}
function connectWS(){
 if(!state.token)return;
 try{
  const scheme=location.protocol==='https:'?'wss':'ws';
  state.ws=new WebSocket(scheme+'://'+location.host+'/ws?token='+encodeURIComponent(state.token));
  state.ws.onmessage=e=>{
    const d=JSON.parse(e.data||'{}');
    if(d.type==='new_message'){
      const c=state.chats.find(x=>x.id===d.message.chat_id);
      if(c){c.last_message=d.message;renderChats()}
      const isActive=state.activeChat?.id===d.message.chat_id;
      addMessage(d.message,true);
      if(!isActive&&d.message.sender_id!==state.user.id&&state.notificationEnabled&&document.hidden&&'Notification' in window&&Notification.permission==='granted'){
        new Notification(d.message.sender?.display_name||'LEDERG',{body:d.message.text||'Новое сообщение'});
      }
    }else if(d.type==='chat_created'){
      loadChats();
    }else if(d.type==='presence'){
      if(d.user_id!==state.user.id)updatePresence(d.user_id,!!d.online);
    }else if(d.type==='typing'){
      if(state.activeChat?.id===d.chat_id&&d.user_id!==state.user.id){
        $('chatSub').innerHTML=d.is_typing?'<span class="typing">печатает…</span>':(state.activeChat.peer?.online?'<span style="color:var(--green)">в сети</span>':'Личный чат');
        clearTimeout(state.typingTimer);
        if(d.is_typing)state.typingTimer=setTimeout(()=>updatePresence(state.activeChat.peer?.id,state.activeChat.peer?.online),2500);
      }
    }
  };
  state.ws.onclose=()=>{state.ws=null;setTimeout(()=>state.token&&connectWS(),2500)};
 }catch{}
}
function sendWS(data){if(state.ws?.readyState===WebSocket.OPEN)state.ws.send(JSON.stringify(data))}
function logout(){localStorage.removeItem('lederg_token');state.token=null;state.user=null;state.ws?.close();state.ws=null;showAuth()}
async function saveProfile(){
 const fd=new FormData();
 fd.append('username',$('setUsername').value.trim());
 fd.append('display_name',$('setDisplayName').value.trim());
 fd.append('bio',$('setBio').value);
 for(const id of ['setDiscoverable','setPresence','setAvatarPublic','setReadReceipts','setAllowMessages'])fd.append(id==='setDiscoverable'?'discoverable':id==='setPresence'?'presence_visible':id==='setAvatarPublic'?'avatar_public':id==='setReadReceipts'?'read_receipts':'allow_messages',$(id).dataset.on==='1'?'true':'false');
 const f=$('avatarFile').files[0];if(f)fd.append('avatar',f);
 if($('removeAvatar').checked)fd.append('remove_avatar','true');
 const old=state.user;
 try{
  state.user=await api('/api/users/me',{method:'PUT',body:fd});
  applyMyProfile();await loadChats();$('setSaveStatus').textContent='Сохранено';if(old.username!==state.user.username)alert('Никнейм изменён. Теперь вход выполняется по новому нику.');
 }catch(e){$('setSaveStatus').textContent=e.message}
}
function toggleEl(el){el.dataset.on=el.dataset.on==='1'?'0':'1';el.classList.toggle('on',el.dataset.on==='1')}
function settingToggle(id,label,desc,on){
 return '<div class="settings-row"><div><div>'+label+'</div><div class="desc">'+desc+'</div></div><button id="'+id+'" class="toggle '+(on?'on':'')+'" data-on="'+(on?'1':'0')+'"></button></div>'
}
function renderSettings(section){
 state.activeSettings=section;
 document.querySelectorAll('.settings-nav button').forEach(b=>b.classList.toggle('active',b.dataset.section===section));
 const c=$('settingsContent');
 if(section==='profile'){
   c.innerHTML='<div class="setting-section"><div class="setting-title">Профиль</div><div class="profile-card">'+avatarHtml(state.user,'avatar profile-big')+'<div><div style="font-weight:800">'+escapeHtml(state.user.display_name)+'</div><div class="preview">@'+escapeHtml(state.user.username)+'</div><div class="preview">'+escapeHtml(state.user.bio||'Нет описания')+'</div></div></div><div class="settings-actions"><label class="secondary" style="cursor:pointer">Новая аватарка<input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp" hidden></label><label class="secondary"><input id="removeAvatar" type="checkbox"> удалить аватар</label></div></div><div class="setting-section"><div class="setting-title">Данные</div><input id="setUsername" class="settings-input" maxlength="32" value="'+escapeHtml(state.user.username)+'" placeholder="Никнейм" style="margin-bottom:9px"><input id="setDisplayName" class="settings-input" maxlength="80" value="'+escapeHtml(state.user.display_name)+'" placeholder="Имя" style="margin-bottom:9px"><textarea id="setBio" class="settings-textarea" maxlength="160" placeholder="О себе">'+escapeHtml(state.user.bio||'')+'</textarea></div><div class="settings-actions"><button id="saveProfile" class="primary" style="width:auto;padding:10px 16px">Сохранить</button><span id="setSaveStatus" class="preview" style="align-self:center"></span></div>';
   $('saveProfile').onclick=saveProfile;
   return;
 }
 if(section==='privacy'){
   c.innerHTML='<div class="setting-section"><div class="setting-title">Приватность</div>'+settingToggle('setDiscoverable','Показывать в глобальном поиске','Можно найти по @нику или имени.',state.user.discoverable)+settingToggle('setPresence','Показывать статус «в сети»','Зелёный индикатор виден только когда ты реально подключён.',state.user.presence_visible)+settingToggle('setAvatarPublic','Показывать аватар другим','Если выключено, чужие пользователи не получают URL аватарки.',state.user.avatar_public)+settingToggle('setReadReceipts','Отправлять статусы прочтения','Разрешить события read в личных чатах.',state.user.read_receipts)+settingToggle('setAllowMessages','Разрешать новые сообщения','Выключи, чтобы новые люди не могли начать с тобой чат.',state.user.allow_messages)+'</div><div class="notice">LEDERG не требует телефон, e-mail или настоящее имя. Приложение не хранит IP-адреса в пользовательской БД и отключает access-лог Uvicorn. Но провайдер CloudPub и сетевые узлы могут иметь собственные технические логи.</div>';
   ['setDiscoverable','setPresence','setAvatarPublic','setReadReceipts','setAllowMessages'].forEach(id=>$(id).onclick=()=>toggleEl($(id)));
   return;
 }
 if(section==='appearance'){
   c.innerHTML='<div class="setting-section"><div class="setting-title">Оформление</div><div class="settings-row"><div><div>Тема</div><div class="desc">Тёмная или светлая оболочка.</div></div><select id="themeSelect" class="settings-select" style="max-width:180px"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></div><div class="settings-row"><div><div>Размер текста</div><div class="desc">Размер текста сообщений.</div></div><input id="textSize" type="range" min="13" max="22" step="1" value="'+escapeHtml(state.textSize)+'"></div>'+settingToggle('setAnimations','Анимации','Включить плавные переходы интерфейса.',state.animations)+settingToggle('setSendEnter','Отправлять Enter','Enter отправляет сообщение, Shift+Enter — новая строка.',state.sendByEnter)+'</div><div class="notice">Фон конкретного личного чата меняется отдельно через ⚙ в шапке.</div>';
   $('themeSelect').value=state.theme;$('themeSelect').onchange=e=>setTheme(e.target.value);
   $('textSize').oninput=e=>{state.textSize=e.target.value;localStorage.setItem('lederg_text_size',state.textSize);applyClientPrefs()};
   $('setAnimations').onclick=()=>{toggleEl($('setAnimations'));state.animations=$('setAnimations').dataset.on==='1';localStorage.setItem('lederg_animations',state.animations?'1':'0');applyClientPrefs()};
   $('setSendEnter').onclick=()=>{toggleEl($('setSendEnter'));state.sendByEnter=$('setSendEnter').dataset.on==='1';localStorage.setItem('lederg_send_enter',state.sendByEnter)};
   return;
 }
 if(section==='notifications'){
   c.innerHTML='<div class="setting-section"><div class="setting-title">Уведомления</div>'+settingToggle('setNotify','Браузерные уведомления','Показывать новые сообщения, когда вкладка скрыта.',state.notificationEnabled)+'</div>';
   $('setNotify').onclick=async()=>{toggleEl($('setNotify'));state.notificationEnabled=$('setNotify').dataset.on==='1';localStorage.setItem('lederg_notify',state.notificationEnabled?'1':'0');if(state.notificationEnabled&&'Notification'in window&&Notification.permission==='default')await Notification.requestPermission();};
   return;
 }
 if(section==='security'){
   c.innerHTML='<div class="setting-section"><div class="setting-title">Пароль</div><input id="oldPassword" class="settings-input" type="password" placeholder="Текущий пароль" style="margin-bottom:8px"><input id="newPassword" class="settings-input" type="password" placeholder="Новый пароль (8+)" style="margin-bottom:8px"><button id="changePassword" class="primary" style="width:auto">Сменить пароль</button><div id="passwordStatus" class="preview" style="margin-top:8px"></div></div><div class="setting-section"><div class="setting-title">Двухэтапная проверка</div><div id="twoFaBox"></div></div><div class="setting-section"><div class="setting-title">Активные сессии</div><div id="sessionsBox">Загрузка…</div><div class="settings-actions"><button id="revokeAll" class="danger">Завершить все сессии</button></div></div><div class="notice">Двухэтапная проверка использует TOTP-код из приложения-аутентификатора. Для настоящей E2EE-защиты личных сообщений нужен отдельный криптографический протокол с ключами устройств — сейчас сервер технически видит текст сообщений.</div>';
   $('changePassword').onclick=async()=>{const st=$('passwordStatus');try{await api('/api/users/password',{method:'POST',body:JSON.stringify({old_password:$('oldPassword').value,new_password:$('newPassword').value})});st.textContent='Пароль изменён. Остальные сессии завершены.';loadSessions()}catch(e){st.textContent=e.message}};
   $('revokeAll').onclick=async()=>{await api('/api/users/sessions/revoke-all',{method:'POST'});logout()};
   render2FA();
   loadSessions();
 }

 }
}
async function loadSessions(){
 const box=$('sessionsBox');if(!box)return;
 try{const rows=await api('/api/users/sessions/list');box.innerHTML=rows.map(s=>'<div class="session"><div class="session-main"><div><b>'+(s.current?'Это устройство':'Другая сессия')+'</b><div><small>Создана: '+new Date(s.created_at).toLocaleString()+'<br>Активна: '+new Date(s.last_seen_at).toLocaleString()+'</small></div></div>'+(s.current?'':('<button class="danger revoke-session" data-id="'+escapeHtml(s.id)+'">Завершить</button>'))+'</div></div>').join('')||'<div class="empty">Сессий нет.</div>';document.querySelectorAll('.revoke-session').forEach(b=>b.onclick=async()=>{await api('/api/users/sessions/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});loadSessions()})}catch(e){box.textContent=e.message}
}
async function loadBlocks(){
 const box=$('blockedBox');if(!box)return;
 try{
  const rows=await api('/api/users/blocks');
  box.innerHTML=rows.length?rows.map(u=>'<div class="session"><div class="session-main"><div><b>'+escapeHtml(u.display_name)+'</b><div><small>@'+escapeHtml(u.username)+'</small></div></div><button class="danger unblock-user" data-id="'+u.id+'">Разблокировать</button></div></div>').join(''):'<div class="empty">Заблокированных пользователей нет.</div>';
  document.querySelectorAll('.unblock-user').forEach(b=>b.onclick=async()=>{await api('/api/users/blocks/'+b.dataset.id,{method:'DELETE'});loadBlocks()});
 }catch(e){box.textContent=e.message}
}
async function blockUser(userId){
 await api('/api/users/blocks',{method:'POST',body:JSON.stringify({user_id:Number(userId)})});
}
async function render2FA(){
 const box=$('twoFaBox');if(!box)return;
 if(state.user.two_factor_enabled){
  box.innerHTML='<div class="notice" style="margin-bottom:10px">Двухэтапная проверка включена.</div><div class="settings-actions"><button id="disable2fa" class="danger">Отключить 2FA</button></div>';
  $('disable2fa').onclick=async()=>{const p=prompt('Текущий пароль:');const code=prompt('Код из authenticator:');if(!p||!code)return;try{await api('/api/users/2fa/disable?code='+encodeURIComponent(code),{method:'POST',body:JSON.stringify({password:p})});await loadMe();renderSettings('security')}catch(e){alert(e.message)}};
 }else{
  box.innerHTML='<div class="notice">Для включения нужен пароль и приложение-аутентификатор.</div><div class="settings-actions"><button id="setup2fa" class="secondary">Настроить 2FA</button></div><div id="twoFaSetup"></div>';
  $('setup2fa').onclick=async()=>{
    const p=prompt('Введите текущий пароль:');if(!p)return;
    try{
      const d=await api('/api/users/2fa/setup',{method:'POST',body:JSON.stringify({password:p})});
      $('twoFaSetup').innerHTML='<div class="profile-card" style="margin-top:10px"><div style="min-width:0"><b>Секрет</b><div class="preview" style="word-break:break-all">'+escapeHtml(d.secret)+'</div><div class="preview" style="word-break:break-all;margin-top:7px">'+escapeHtml(d.otpauth_uri)+'</div><input id="confirm2faCode" class="settings-input" inputmode="numeric" placeholder="Код из authenticator" style="margin-top:10px"><button id="confirm2fa" class="primary" style="width:auto;margin-top:8px">Подтвердить 2FA</button></div></div>';
      $('confirm2fa').onclick=async()=>{try{await api('/api/users/2fa/confirm',{method:'POST',body:JSON.stringify({code:$('confirm2faCode').value})});await loadMe();renderSettings('security')}catch(e){alert(e.message)}};
    }catch(e){alert(e.message)}
  };
 }
}
function openSettings(section=state.activeSettings){$('settingsModal').style.display='grid';renderSettings(section)}
function closeSettings(){$('settingsModal').style.display='none'}
async function loadChatWallpaper(chatId){
 try{const d=await api('/api/chats/'+chatId+'/settings');applyWallpaper(d.wallpaper_url);setChatMuteUi(!!d.muted)}catch{}
}
function setChatMuteUi(muted){const b=$('muteChatBtn');if(b)b.textContent=muted?'Сообщения без звука':'Без звука'}
async function toggleMute(){
 if(!state.activeChat)return;
 const b=$('muteChatBtn');const muted=b?.textContent!=='Сообщения без звука';
 try{await api('/api/chats/'+state.activeChat.id+'/mute?muted='+muted,{method:'POST'});setChatMuteUi(muted)}catch(e){alert(e.message)}
}
function applyWallpaper(url){
 const box=$('messages');
 if(url)box.style.backgroundImage='linear-gradient(rgba(8,14,21,.48),rgba(8,14,21,.48)),url("'+url+'")';
 else box.style.backgroundImage='radial-gradient(circle at 50% 10%,rgba(38,66,95,.18),transparent 45%)';
}
async function setWallpaper(file){
 if(!state.activeChat)return;
 const fd=new FormData();fd.append('wallpaper',file);
 try{const d=await api('/api/chats/'+state.activeChat.id+'/wallpaper',{method:'POST',body:fd});applyWallpaper(d.wallpaper_url)}catch(e){alert(e.message)}
}
async function clearWallpaper(){
 if(!state.activeChat)return;
 try{await api('/api/chats/'+state.activeChat.id+'/wallpaper',{method:'DELETE'});applyWallpaper(null)}catch(e){alert(e.message)}
}
function logoutAndClose(){closeSettings();logout()}
$('tabLogin').onclick=()=>setAuthMode('login');
$('tabRegister').onclick=()=>setAuthMode('register');
$('authForm').onsubmit=async e=>{
 e.preventDefault();$('authError').textContent='';
 const body={username:$('username').value,password:$('password').value};
 if(state.authMode==='register')body.display_name=$('displayName').value;
 if(state.requires2fa)body.otp_code=$('otpCode').value.trim();
 try{
  const r=await fetch(state.authMode==='register'?'/api/auth/register':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){
    if(d.detail?.requires_2fa){
      state.requires2fa=true;$('otpCode').style.display='block';$('authButton').textContent='Подтвердить вход';$('authError').textContent=d.detail.message||'Введите код 2FA';$('otpCode').focus();return;
    }
    throw new Error(typeof d.detail==='string'?d.detail:'Ошибка сервера');
  }
  state.requires2fa=false;$('otpCode').style.display='none';$('authButton').textContent='Войти';
  state.token=d.access_token;localStorage.setItem('lederg_token',state.token);await boot();
 }catch(err){$('authError').textContent=err.message}
};

$('settingsBtn').onclick=()=>openSettings();
$('settingsClose').onclick=closeSettings;
$('settingsModal').onclick=e=>{if(e.target===$('settingsModal'))closeSettings()};
document.querySelectorAll('.settings-nav button').forEach(b=>b.onclick=()=>renderSettings(b.dataset.section));
$('logout').onclick=logoutAndClose;
$('searchInput').oninput=()=>{clearTimeout(state.searchTimer);state.searchTimer=setTimeout(()=>findUsers($('searchInput').value),180)};
$('messageInput').oninput=()=>{if(state.activeChat)sendWS({type:'typing',chat_id:state.activeChat.id,is_typing:$('messageInput').value.length>0})};
$('messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&state.sendByEnter){e.preventDefault();$('composer').requestSubmit()}};
$('composer').onsubmit=async e=>{
 e.preventDefault();if(!state.activeChat)return;
 const input=$('messageInput');const textValue=input.value.trim();if(!textValue)return;input.value='';
 sendWS({type:'typing',chat_id:state.activeChat.id,is_typing:false});
 try{const msg=await api('/api/chats/'+state.activeChat.id+'/messages',{method:'POST',body:JSON.stringify({text:textValue})});addMessage(msg,true)}catch(err){input.value=textValue;alert(err.message)}
};
$('messages').onscroll=()=>{if(state.activeChat&&$('messages').scrollTop<30)sendWS({type:'read',chat_id:state.activeChat.id,message_id:$('messages').lastElementChild?.dataset?.id})};
$('backBtn').onclick=()=>{$('chatPane').classList.remove('open');$('sidebar').classList.remove('hidden')};
$('chatSettingsBtn').onclick=()=>{$('chatSettingsModal').style.display='grid';loadChatWallpaper(state.activeChat.id)};
$('chatSettingsClose').onclick=()=>{$('chatSettingsModal').style.display='none'};
$('chatSettingsModal').onclick=e=>{if(e.target===$('chatSettingsModal'))$('chatSettingsModal').style.display='none'};
$('wallpaperInput').onchange=e=>{const f=e.target.files[0];if(f)setWallpaper(f);e.target.value=''};
$('wallpaperClear').onclick=clearWallpaper;
$('muteChatBtn').onclick=toggleMute;
$('blockChatUserBtn').onclick=async()=>{const uid=state.activeChat?.peer?.id;if(!uid)return;try{await blockUser(uid);alert('Пользователь заблокирован. Новые сообщения от него запрещены.');$('chatSettingsModal').style.display='none';}catch(e){alert(e.message)}};
document.querySelectorAll('.quick-wall').forEach(b=>b.onclick=async()=>{if(b.dataset.wall==='gradient'){$('messages').style.backgroundImage='linear-gradient(135deg,rgba(24,70,105,.95),rgba(17,28,42,.98))'}else applyWallpaper(null)});
window.addEventListener('resize',()=>{if(innerWidth>760){$('sidebar').classList.remove('hidden');$('chatPane').classList.remove('open')}});
window.addEventListener('beforeunload',()=>{try{state.ws?.close()}catch{}});
async function boot(){try{await loadMe();setTheme(state.theme);applyClientPrefs();showApp();await loadChats();connectWS()}catch(e){showAuth()}}
setAuthMode('login');setTheme(state.theme);applyClientPrefs();
if(state.token)boot();else showAuth();
</script>
</body>
</html>
